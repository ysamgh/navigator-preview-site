<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Atlas</title>
<style>
:root{font-family:system-ui;color:#eaf1f8;background:#10151d;--p:#1a2430;--b:#304253;--m:#a5b5c5;--a:#83c2ff}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#141d27;border-bottom:1px solid var(--b)}main{max-width:1200px;margin:auto;padding:16px}h1{margin:0;font-size:1.4rem}header p,.meta{color:var(--m);font-size:.82rem}.toolbar,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.tabs button,.pathbox select{padding:10px;border:1px solid var(--b);background:var(--p);color:inherit;border-radius:8px}.toolbar #q{flex:1;min-width:200px}.tabs button{cursor:pointer}.tabs button.active{background:#31506d}.layout{display:grid;grid-template-columns:280px 1fr;gap:12px}.panel{border:1px solid var(--b);border-radius:10px;background:var(--p);overflow:hidden}.list{max-height:70vh;overflow:auto}.item{padding:12px;border-bottom:1px solid var(--b);cursor:pointer}.item.active,.item:hover{background:#26384b}.item h3{margin:0 0 5px;font-size:1rem}.tag{border:1px solid var(--b);border-radius:20px;padding:2px 7px;font-size:.7rem;color:var(--m)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.content{padding:16px;min-height:55vh;overflow:auto}.content h2{margin-top:0}.content a{color:var(--a)}pre{background:#101720;border:1px solid var(--b);border-radius:8px;padding:12px;overflow:auto}code{font-family:monospace}.relations a{display:inline-block;margin:3px;border:1px solid var(--b);padding:5px 8px;border-radius:8px;text-decoration:none}.empty{padding:18px;color:var(--m)}#graph{width:100%;min-width:800px;background:#101720}#graph .edge{stroke:#72879c;stroke-opacity:.7}#graph .node{cursor:pointer}#graph rect{fill:#22374b;stroke:#54708a;rx:9}#graph .node.selected rect,#graph .node:hover rect{fill:#345b7d}#graph text{fill:#eef5fc;font-size:12px;text-anchor:middle;pointer-events:none}.step{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--b)}.step button{background:none;border:0;color:var(--a);cursor:pointer;text-align:left;font-weight:600}.step small{display:block;color:var(--m);margin-top:4px}footer{padding:10px;color:var(--m);font-size:.8rem}@media(max-width:720px){.layout{grid-template-columns:1fr}.list{max-height:30vh}}
</style></head><body><header><h1>Knowledge Atlas Navigator</h1><p>Browse maps, inspect relations, read in place, and follow learning paths.</p></header><main>
<div class="toolbar"><input id="q" placeholder="Search titles, domains, tags…"><select id="domain"><option value="">All domains</option></select><select id="status"><option value="">All statuses</option><option>draft</option><option>validated</option><option>operational</option><option>planned</option><option>needs-review</option></select></div>
<div class="tabs"><button class="active" data-v="browse">Browse / Read</button><button data-v="graph">Graph</button><button data-v="paths">Learning Paths</button></div>
<div id="browse" class="layout"><section class="panel"><div class="list" id="list">Loading…</div><footer id="count"></footer></section><section class="panel"><article id="detail" class="content">Select a map.</article></section></div>
<section id="graphView" class="panel" hidden><div class="content"><p class="meta">Solid edges: prerequisites. Dashed: related maps. Click a node.</p><div style="overflow:auto"><svg id="graph"></svg></div></div></section>
<section id="pathView" class="panel" hidden><div class="content pathbox"><select id="pathSelect"></select><div id="pathContent"></div></div></section></main>
<script>
const mapsUrl='./maps-index.json',pathsUrl='./learning-paths.json',root='./',github='https://github.com/ysamgh/map/blob/navigator-preview/';let maps=[],paths=[],active='',view='browse';const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function opts(){[...new Set(maps.map(x=>x.domain))].sort().forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d;$('#domain').append(o)})}
function filtered(){let q=$('#q').value.toLowerCase().trim(),d=$('#domain').value,s=$('#status').value;return maps.filter(m=>(!d||d===m.domain)&&(!s||s===m.status)&&(!q||[m.title,m.id,m.domain,m.summary,...m.tags||[]].join(' ').toLowerCase().includes(q)))}
function list(){let a=filtered();$('#count').textContent=a.length+' / '+maps.length;$('#list').innerHTML=a.map(m=>`<div class="item ${active===m.id?'active':''}" data-id="${esc(m.id)}"><h3>${esc(m.title)}</h3><div class="meta">${esc(m.domain)} · ${esc(m.status)}</div><div class="tags">${(m.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div></div>`).join('')||'<p class="empty">No results</p>';$('#list').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openMap(x.dataset.id))}
function rel(ids){return (ids||[]).map(id=>{let m=maps.find(x=>x.id===id);return m?`<a href="#" data-rel="${esc(id)}">${esc(m.title)}</a>`:''}).join('')||'<span class="meta">None</span>'}
function inline(s){let x=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');return x.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(z,t,u)=>'<a href="'+esc(/^(https?:|\.\.?\/|#)/.test(u)?u:'#')+'" target="_blank" rel="noopener">'+t+'</a>')}
function md(s){let lines=s.split(/\r?\n/),o=[],code=[],f=false,ul=false;function close(){if(ul){o.push('</ul>');ul=false}}function cells(l){return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim())}function isSep(l){return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l)}for(let i=0;i<lines.length;i++){let l=lines[i];if(l.startsWith('```')){close();if(f){o.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=[];f=false}else f=true;continue}if(f){code.push(l);continue}if(i+1<lines.length&&l.trim().startsWith('|')&&isSep(lines[i+1])){close();let head=cells(l),rows=[];i+=2;while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(cells(lines[i]));i++}i--;o.push('<div style=\"overflow:auto\"><table style=\"border-collapse:collapse;width:100%\"><thead><tr>'+head.map(c=>'<th style=\"border:1px solid var(--b);padding:6px;text-align:left\">'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,j)=>'<td style=\"border:1px solid var(--b);padding:6px\">'+inline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}if(/^\s*[-*]\s/.test(l)){if(!ul){o.push('<ul>');ul=true}o.push('<li>'+inline(l.replace(/^\s*[-*]\s/,''))+'</li>');continue}close();if(!l.trim())continue;let h=l.match(/^(#{1,6})\s+(.*)$/);if(h)o.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');else if(/^---+$/.test(l.trim()))o.push('<hr>');else if(/^>\s?/.test(l))o.push('<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>');else o.push('<p>'+inline(l)+'</p>')}close();if(f)o.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');return o.join('')}
async function openMap(id){active=id;list();let m=maps.find(x=>x.id===id);if(!m)return;$('#detail').innerHTML='<p class="empty">Loading map…</p>';try{let r=await fetch(root+m.path);if(!r.ok)throw Error('HTTP '+r.status);let text=await r.text();$('#detail').innerHTML=`<h2>${esc(m.title)}</h2><div class="meta">${esc(m.id)} · ${esc(m.domain)} · ${esc(m.status)} · last review ${esc(m.updated)}</div><div class="tags">${(m.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div><p>${esc(m.summary||'')}</p><h3>Prerequisites</h3><div class="relations">${rel(m.prerequisites)}</div><h3>Related maps</h3><div class="relations">${rel(m.related_maps)}</div><hr><div>${md(text)}</div><p><a target="_blank" rel="noopener" href="${github+encodeURI(m.path)}">Source on GitHub ↗</a></p>`;$('#detail').querySelectorAll('[data-rel]').forEach(a=>a.onclick=e=>{e.preventDefault();openMap(a.dataset.rel);switchView('browse')})}catch(e){$('#detail').innerHTML='<p>Fetch error: '+esc(e.message)+'</p><a href="'+github+encodeURI(m.path)+'">Open on GitHub</a>'}}
function graph(){let svg=$('#graph'),w=Math.max(800,svg.parentElement.clientWidth),h=Math.max(650,maps.length*40);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.style.height=h+'px';let depth=Object.fromEntries(maps.map(m=>[m.id,0]));for(let pass=0;pass<maps.length;pass++)maps.forEach(m=>(m.prerequisites||[]).forEach(p=>{if(depth[p]!==undefined)depth[m.id]=Math.max(depth[m.id],depth[p]+1)}));let max=Math.max(0,...Object.values(depth)),cols=Array.from({length:max+1},()=>[]);maps.forEach(m=>cols[depth[m.id]].push(m));let pos={};cols.forEach((c,x)=>c.forEach((m,y)=>pos[m.id]={x:65+x*(w-130)/Math.max(1,max),y:35+y*(h-70)/Math.max(1,c.length-1)}));let z=[];maps.forEach(m=>(m.prerequisites||[]).forEach(p=>{if(pos[p])z.push(`<line class="edge" stroke-width="1.5" x1="${pos[p].x}" y1="${pos[p].y}" x2="${pos[m.id].x}" y2="${pos[m.id].y}"/>`)}));maps.forEach(m=>(m.related_maps||[]).forEach(id=>{if(pos[id]&&m.id<id)z.push(`<line class="edge" stroke-dasharray="4 5" x1="${pos[m.id].x}" y1="${pos[m.id].y}" x2="${pos[id].x}" y2="${pos[id].y}"/>`)}));maps.forEach(m=>{let p=pos[m.id],t=m.title.length>27?m.title.slice(0,25)+'…':m.title;z.push(`<g class="node ${active===m.id?'selected':''}" data-id="${esc(m.id)}" transform="translate(${p.x},${p.y})"><rect x="-108" y="-16" width="216" height="32"/><text y="4">${esc(t)}</text></g>`)});svg.innerHTML=z.join('');svg.querySelectorAll('.node').forEach(n=>n.onclick=()=>{openMap(n.dataset.id);switchView('browse')})}
function pathRender(){let p=paths.find(x=>x.id===$('#pathSelect').value)||paths[0];if(!p)return;$('#pathContent').innerHTML=`<h2>${esc(p.title)}</h2><p>${esc(p.goal)}</p><p class="meta">${esc(p.estimated_hours||'')} · ${esc(p.audience||'')}</p><ol>${p.steps.map((id,i)=>{let m=maps.find(x=>x.id===id);return m?`<li class="step"><span>${i+1}</span><div><button data-open="${esc(id)}">${esc(m.title)}</button><small>${esc(m.summary||'Read this map and note the practical takeaways.')}</small></div></li>`:'<li>Missing '+esc(id)+'</li>'}).join('')}</ol><h3>Outcome</h3><p>${esc(p.outcome)}</p>`;$('#pathContent').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openMap(b.dataset.open);switchView('browse')})}
function switchView(v){view=v;$('.tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('#browse').hidden=v!=='browse';$('#graphView').hidden=v!=='graph';$('#pathView').hidden=v!=='paths';if(v==='graph')graph();if(v==='paths')pathRender()}
async function init(){try{let [a,b]=await Promise.all([fetch(mapsUrl),fetch(pathsUrl)]);if(!a.ok||!b.ok)throw Error('fetch failed');maps=(await a.json()).maps;paths=(await b.json()).paths;opts();list();if(maps[0])openMap(maps[0].id);$('#q').oninput=list;$('#domain').onchange=list;$('#status').onchange=list;$('.tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));$('#pathSelect').innerHTML=paths.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title)+'</option>').join('');$('#pathSelect').onchange=pathRender;window.onresize=()=>view==='graph'&&graph()}catch(e){$('#list').innerHTML='<p class="empty">Failed loading catalog: '+esc(e.message)+'</p>'}}init();
</script></body></html>
